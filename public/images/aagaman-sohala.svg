<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#701722"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="240" r="220" fill="url(#sun)"/>

  <!-- City Skyline Silhouette in background -->
  <path d="M0,450 L60,450 L60,400 L120,400 L120,430 L180,430 L180,380 L230,380 L230,450 L570,450 L570,390 L640,390 L640,430 L720,430 L720,410 L800,410 L800,600 L0,600 Z" fill="#24070a" opacity="0.6"/>

  <!-- Saffron Flags / Jari Pataka wave -->
  <path d="M150,220 Q200,190 230,230 L230,260 Q200,220 150,250 Z" fill="#ea580c"/>
  <line x1="150" y1="220" x2="150" y2="480" stroke="#78350f" stroke-width="4"/>
  
  <path d="M650,200 Q700,170 730,210 L730,240 Q700,200 650,230 Z" fill="#ea580c"/>
  <line x1="650" y1="200" x2="650" y2="480" stroke="#78350f" stroke-width="4"/>

  <!-- Chariot / Rath with Ganpati Murti Aagaman Silhouette -->
  <path d="M280,420 L520,420 L550,490 L250,490 Z" fill="#dfb15b" stroke="#78350f" stroke-width="3"/>
  <!-- Rath Wheels -->
  <circle cx="310" cy="510" r="30" fill="#78350f" stroke="#dfb15b" stroke-width="4"/>
  <circle cx="490" cy="510" r="30" fill="#78350f" stroke="#dfb15b" stroke-width="4"/>

  <!-- Ganesha Murti veiled in sacred yellow peetambar atop the Rath -->
  <circle cx="400" cy="270" r="50" fill="#ffeaa7"/>
  <polygon points="400,180 375,240 425,240" fill="#f59e0b"/>
  <path d="M350,270 C350,370 450,370 450,270 Z" fill="#fef08a"/>
  <!-- Auspicious Umbrella (Chhatra) -->
  <path d="M320,160 Q400,100 480,160 Z" fill="#b91c1c" stroke="#dfb15b" stroke-width="3"/>
  <line x1="400" y1="130" x2="400" y2="180" stroke="#dfb15b" stroke-width="4"/>

  <!-- Gulal & Flower Petals in Air -->
  <circle cx="220" cy="280" r="8" fill="#e11d48" opacity="0.7"/>
  <circle cx="260" cy="240" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="560" cy="250" r="7" fill="#e11d48" opacity="0.7"/>
  <circle cx="530" cy="290" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="380" cy="180" r="6" fill="#e11d48" opacity="0.75"/>
  <circle cx="440" cy="190" r="5" fill="#facc15" opacity="0.8"/>

  <!-- Youth Crowd / Dhol-Tasha Players Silhouette -->
  <!-- Dhol Player Left -->
  <circle cx="190" cy="450" r="16" fill="#180408"/>
  <path d="M175,466 L205,466 L215,560 L165,560 Z" fill="#180408"/>
  <!-- Dhol hanging on shoulder -->
  <ellipse cx="205" cy="500" rx="24" ry="16" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>

  <!-- Cheering Youth Center-Right -->
  <circle cx="610" cy="445" r="16" fill="#180408"/>
  <path d="M595,461 L625,461 L635,560 L585,560 Z" fill="#180408"/>
  <line x1="610" y1="460" x2="630" y2="410" stroke="#180408" stroke-width="6" stroke-linecap="round"/>

  <!-- More crowd heads -->
  <circle cx="120" cy="480" r="14" fill="#180408"/>
  <circle cx="250" cy="470" r="15" fill="#180408"/>
  <circle cx="550" cy="465" r="15" fill="#180408"/>
  <circle cx="680" cy="475" r="14" fill="#180408"/>

  <!-- Banner text -->
  <rect x="230" y="540" width="340" height="36" rx="6" fill="#701722" stroke="#dfb15b" stroke-width="2"/>
  <text x="400" y="563" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="14" fill="#fef08a" text-anchor="middle">॥ बाप्पांचे आगमन सोहळा • ढोल-ताशा गजर ॥</text>
</svg>
