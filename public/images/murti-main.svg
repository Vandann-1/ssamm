<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#420d14"/>
      <stop offset="40%" stop-color="#701722"/>
      <stop offset="100%" stop-color="#24070a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c79b48" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#701722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fdf3cb"/>
      <stop offset="50%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#aa8033"/>
    </linearGradient>
    <linearGradient id="pitambar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgG)"/>
  
  <!-- Temple Arch & Pillars Background -->
  <path d="M120,600 L120,180 Q400,60 680,180 L680,600" fill="none" stroke="#8f6c2c" stroke-width="4" opacity="0.4"/>
  <path d="M140,600 L140,195 Q400,85 660,195 L660,600" fill="none" stroke="#dfb15b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Divine Halo (Prabhavali) -->
  <circle cx="400" cy="220" r="160" fill="url(#halo)"/>
  <circle cx="400" cy="220" r="145" fill="none" stroke="#fdf3cb" stroke-width="2.5" opacity="0.75"/>
  <circle cx="400" cy="220" r="152" fill="none" stroke="#dfb15b" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.9"/>

  <!-- Pedestal / Asana -->
  <path d="M220,530 L580,530 L620,580 L180,580 Z" fill="#5a101b" stroke="#dfb15b" stroke-width="3"/>
  <path d="M240,510 L560,510 L580,530 L220,530 Z" fill="url(#goldG)"/>
  <rect x="250" y="535" width="300" height="20" fill="#701722" rx="4"/>
  <text x="400" y="550" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffe8a3" text-anchor="middle" letter-spacing="3">श्री साई आशिष मित्र मंडळ</text>

  <!-- Lotus Throne Petals -->
  <path d="M260,510 C310,480 350,510 400,490 C450,510 490,480 540,510 Z" fill="#dfb15b" opacity="0.9"/>

  <!-- Lord Ganesha Body & Dhoti -->
  <!-- Legs folded -->
  <path d="M260,500 C270,440 340,430 400,440 C460,430 530,440 540,500 C500,520 300,520 260,500 Z" fill="url(#pitambar)" stroke="#8f6c2c" stroke-width="2"/>
  
  <!-- Torso & Stomach (Lambodara) -->
  <path d="M320,380 C320,460 480,460 480,380 C480,340 320,340 320,380 Z" fill="#fdfaf3" stroke="#e6ca85" stroke-width="2"/>
  <!-- Pitambar Drape / Angavastra -->
  <path d="M330,350 Q400,390 470,350 L475,375 Q400,415 325,375 Z" fill="#b45309"/>
  <!-- Janve (Sacred Thread) -->
  <path d="M350,330 Q370,390 450,425" fill="none" stroke="#dfb15b" stroke-width="2.5" stroke-dasharray="6,2"/>

  <!-- Hands -->
  <!-- Blessing Right Hand (Abhaya Mudra) -->
  <path d="M275,350 C260,330 265,300 285,300 C300,300 305,325 315,355 Z" fill="#fdfaf3" stroke="#e6ca85" stroke-width="1.5"/>
  <circle cx="280" cy="320" r="4" fill="#a42636"/>
  <!-- Swastika on palm -->
  <path d="M278,318 L282,318 M280,316 L280,320" stroke="#fdfaf3" stroke-width="1"/>

  <!-- Left Hand holding Modak Patra -->
  <path d="M525,350 C540,330 535,300 515,300 C500,300 495,325 485,355 Z" fill="#fdfaf3" stroke="#e6ca85" stroke-width="1.5"/>
  <!-- Modak bowl -->
  <ellipse cx="505" cy="330" rx="15" ry="8" fill="url(#goldG)"/>
  <circle cx="505" cy="325" r="5" fill="#fef3c7" stroke="#aa8033" stroke-width="0.5"/>

  <!-- Ears (Surpakarna) -->
  <path d="M330,220 C240,190 230,290 320,280 Z" fill="#fdfaf3" stroke="#dfb15b" stroke-width="2"/>
  <path d="M315,230 C260,215 255,275 315,268 Z" fill="#fae9eb"/>
  
  <path d="M470,220 C560,190 570,290 480,280 Z" fill="#fdfaf3" stroke="#dfb15b" stroke-width="2"/>
  <path d="M485,230 C540,215 545,275 485,268 Z" fill="#fae9eb"/>

  <!-- Head / Forehead (Mastak) -->
  <path d="M330,225 C330,165 470,165 470,225 C470,270 330,270 330,225 Z" fill="#fdfaf3" stroke="#e6ca85" stroke-width="2"/>
  
  <!-- Sacred Tilak / Trishul motif on forehead -->
  <path d="M396,175 L404,175 L401,205 L399,205 Z" fill="#a42636"/>
  <path d="M390,185 Q400,192 410,185" fill="none" stroke="#dfb15b" stroke-width="2.5"/>
  <circle cx="400" cy="208" r="3" fill="#a42636"/>

  <!-- Eyes (Benevolent and peaceful) -->
  <path d="M352,215 Q367,210 380,218" fill="none" stroke="#241c1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M448,215 Q433,210 420,218" fill="none" stroke="#241c1b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trunk (Sond) curving rightward auspiciously with Modak -->
  <path d="M385,245 C385,290 415,315 425,340 C435,365 460,360 460,345 C460,335 445,335 440,320 C430,300 415,280 415,245 Z" fill="#fdfaf3" stroke="#e6ca85" stroke-width="2"/>
  <!-- Decorative rings on trunk -->
  <path d="M400,280 Q408,282 418,280" fill="none" stroke="#dfb15b" stroke-width="2"/>
  <path d="M410,310 Q418,312 428,310" fill="none" stroke="#dfb15b" stroke-width="2"/>

  <!-- Royal Mukut / Golden Crown -->
  <polygon points="400,80 345,175 455,175" fill="url(#goldG)" stroke="#8f6c2c" stroke-width="2"/>
  <circle cx="400" cy="75" r="7" fill="#ffe8a3" stroke="#aa8033" stroke-width="1"/>
  <!-- Rubies & emeralds in crown -->
  <circle cx="400" cy="120" r="5" fill="#a42636"/>
  <circle cx="380" cy="150" r="4" fill="#047857"/>
  <circle cx="420" cy="150" r="4" fill="#047857"/>
  <rect x="360" y="165" width="80" height="10" fill="#a42636" rx="2"/>

  <!-- Sacred Rose & Marigold Garland (Haar) -->
  <path d="M335,270 Q400,430 465,270" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-dasharray="14,4"/>
  <path d="M335,270 Q400,430 465,270" fill="none" stroke="#a42636" stroke-width="8" stroke-dasharray="8,8"/>

  <!-- Diya / Oil Lamps in front -->
  <!-- Left Diya -->
  <ellipse cx="180" cy="540" rx="25" ry="10" fill="url(#goldG)"/>
  <path d="M180,535 Q175,510 180,495 Q185,510 180,535 Z" fill="#ffedd5" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="180" cy="515" r="14" fill="#f59e0b" opacity="0.3"/>
  <!-- Right Diya -->
  <ellipse cx="620" cy="540" rx="25" ry="10" fill="url(#goldG)"/>
  <path d="M620,535 Q615,510 620,495 Q625,510 620,535 Z" fill="#ffedd5" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="620" cy="515" r="14" fill="#f59e0b" opacity="0.3"/>

  <!-- Top Title / Badge -->
  <rect x="270" y="20" width="260" height="32" rx="16" fill="#5a101b" stroke="#dfb15b" stroke-width="1.5"/>
  <text x="400" y="41" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="14" fill="#fdf3cb" text-anchor="middle">॥ श्री गणेशाय नमः ॥</text>
</svg>
