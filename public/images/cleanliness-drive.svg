<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#cleanSky)"/>
  <rect y="420" width="800" height="180" fill="url(#ground)"/>

  <!-- Pandal Exterior in Background -->
  <polygon points="100,420 400,240 700,420" fill="#701722" stroke="#dfb15b" stroke-width="3"/>
  <rect x="340" y="320" width="120" height="100" fill="#fdfaf3" stroke="#aa8033" stroke-width="2"/>
  <text x="400" y="375" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="12" fill="#701722" text-anchor="middle">उत्सव मंडप</text>

  <!-- Green Nirmalya Bins & Segregated Cleanliness System -->
  <!-- Bin 1: Organic Nirmalya / Flowers -->
  <rect x="160" y="380" width="70" height="110" rx="10" fill="#15803d" stroke="#14532d" stroke-width="3"/>
  <rect x="150" y="365" width="90" height="18" rx="6" fill="#166534"/>
  <circle cx="195" cy="425" r="16" fill="#ffffff" opacity="0.9"/>
  <!-- Leaf Icon inside -->
  <path d="M195,415 Q205,420 203,432 Q195,435 188,430 Q187,420 195,415 Z" fill="#15803d"/>
  <text x="195" y="465" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">निर्माल्य कलश</text>

  <!-- Bin 2: Dry Clean Waste -->
  <rect x="250" y="390" width="60" height="100" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
  <rect x="242" y="378" width="76" height="15" rx="5" fill="#0369a1"/>
  <text x="280" y="470" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="9" fill="#ffffff" text-anchor="middle">सुका कचरा</text>

  <!-- Dedicated Youth Volunteers in White Kurta / Mandal T-Shirt Cleaning -->
  <!-- Volunteer 1 with Broom (झाडू) -->
  <circle cx="480" cy="350" r="18" fill="#fbcfe8"/>
  <path d="M460,370 L500,370 L515,470 L450,470 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="470" y="390" width="22" height="12" fill="#701722" rx="2"/>
  <!-- Arm holding broom -->
  <line x1="470" y1="390" x2="430" y2="430" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  <!-- Long Broom Stick & Bristles -->
  <line x1="410" y1="360" x2="460" y2="510" stroke="#78350f" stroke-width="4"/>
  <polygon points="450,490 480,520 455,525 435,505" fill="#f59e0b"/>

  <!-- Volunteer 2 with Nirmalya Basket -->
  <circle cx="610" cy="355" r="18" fill="#fbcfe8"/>
  <path d="M590,375 L630,375 L645,470 L580,470 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="600" y="395" width="22" height="12" fill="#701722" rx="2"/>
  <!-- Basket in hands -->
  <ellipse cx="640" cy="430" rx="30" ry="16" fill="#d97706" stroke="#78350f" stroke-width="2"/>
  <!-- Flowers inside basket -->
  <circle cx="630" cy="425" r="5" fill="#ef4444"/>
  <circle cx="645" cy="422" r="6" fill="#f59e0b"/>
  <circle cx="655" cy="426" r="5" fill="#ec4899"/>

  <!-- Spotless Ground Shine Sparkles -->
  <polygon points="340,490 345,500 355,505 345,510 340,520 335,510 325,505 335,500" fill="#f59e0b" opacity="0.8"/>
  <polygon points="560,510 563,518 571,521 563,524 560,532 557,524 549,521 557,518" fill="#0284c7" opacity="0.8"/>

  <!-- Banner -->
  <rect x="180" y="535" width="440" height="42" rx="8" fill="#15803d" stroke="#fef08a" stroke-width="2"/>
  <text x="400" y="561" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">॥ परिसर स्वच्छता अभियान व निर्माल्य व्यवस्थापन ॥</text>
</svg>
