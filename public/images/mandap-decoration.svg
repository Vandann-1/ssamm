<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hallG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a080d"/>
      <stop offset="60%" stop-color="#5a101b"/>
      <stop offset="100%" stop-color="#140305"/>
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#c79b48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a101b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#hallG)"/>
  <circle cx="400" cy="180" r="240" fill="url(#chandelierGlow)"/>

  <!-- Ornate Golden Mandap Pillars (Left and Right) -->
  <!-- Left Pillar -->
  <rect x="80" y="80" width="70" height="520" fill="#aa8033" stroke="#fdf3cb" stroke-width="2"/>
  <rect x="70" y="60" width="90" height="30" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <rect x="60" y="560" width="110" height="40" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <!-- Pillar carving patterns -->
  <line x1="100" y1="90" x2="100" y2="560" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="130" y1="90" x2="130" y2="560" stroke="#78350f" stroke-width="1.5"/>

  <!-- Right Pillar -->
  <rect x="650" y="80" width="70" height="520" fill="#aa8033" stroke="#fdf3cb" stroke-width="2"/>
  <rect x="640" y="60" width="90" height="30" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <rect x="630" y="560" width="110" height="40" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <!-- Pillar carving patterns -->
  <line x1="670" y1="90" x2="670" y2="560" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="700" y1="90" x2="700" y2="560" stroke="#78350f" stroke-width="1.5"/>

  <!-- Grand Temple Arch (Kirti Mukha) -->
  <path d="M115,80 Q400,-20 685,80 L660,130 Q400,30 140,130 Z" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <path d="M140,130 Q400,45 660,130" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Hanging Marigold Garlands (Toran) -->
  <path d="M115,100 Q250,180 400,110 Q550,180 685,100" fill="none" stroke="#f59e0b" stroke-width="14" stroke-dasharray="12,4"/>
  <path d="M115,130 Q250,210 400,140 Q550,210 685,130" fill="none" stroke="#ef4444" stroke-width="10" stroke-dasharray="8,6"/>

  <!-- Central Sanctuary Platform & Backlit Golden Jali Screen -->
  <rect x="240" y="220" width="320" height="340" fill="#32070c" stroke="#dfb15b" stroke-width="2"/>
  <!-- Jali Grid Pattern -->
  <g opacity="0.25" stroke="#fef08a" stroke-width="1">
    <line x1="280" y1="220" x2="280" y2="560"/>
    <line x1="320" y1="220" x2="320" y2="560"/>
    <line x1="360" y1="220" x2="360" y2="560"/>
    <line x1="400" y1="220" x2="400" y2="560"/>
    <line x1="440" y1="220" x2="440" y2="560"/>
    <line x1="480" y1="220" x2="480" y2="560"/>
    <line x1="520" y1="220" x2="520" y2="560"/>
  </g>

  <!-- Glowing Murti Silhouette in Sanctuary -->
  <circle cx="400" cy="330" r="50" fill="#fef08a" opacity="0.9"/>
  <path d="M350,330 C350,440 450,440 450,330 Z" fill="#fef08a" opacity="0.8"/>
  <polygon points="400,240 370,300 430,300" fill="#dfb15b"/>

  <!-- Hanging Brass Bell -->
  <line x1="400" y1="0" x2="400" y2="80" stroke="#aa8033" stroke-width="3"/>
  <path d="M380,80 L420,80 L430,120 L370,120 Z" fill="#dfb15b" stroke="#78350f" stroke-width="2"/>
  <circle cx="400" cy="125" r="7" fill="#78350f"/>

  <!-- Golden Diyas at Bottom Floor -->
  <ellipse cx="260" cy="565" rx="20" ry="8" fill="#dfb15b"/>
  <path d="M260,560 Q255,540 260,525 Q265,540 260,560 Z" fill="#fef08a"/>
  
  <ellipse cx="540" cy="565" rx="20" ry="8" fill="#dfb15b"/>
  <path d="M540,560 Q535,540 540,525 Q545,540 540,560 Z" fill="#fef08a"/>

  <!-- Label Badge -->
  <rect x="220" y="550" width="360" height="34" rx="6" fill="#701722" stroke="#dfb15b" stroke-width="2"/>
  <text x="400" y="572" font-family="'Noto Sans Devanagari', sans-serif" font-weight="bold" font-size="14" fill="#fef08a" text-anchor="middle">॥ भव्य मंदिर मंडप कला व विद्युत रोषणाई ॥</text>
</svg>
